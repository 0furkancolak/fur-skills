name: fur-skills-quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  doctor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run repo doctor
        run: bun run repo-doctor

      - name: Run core eval metadata checks
        run: |
          bun src/cli.ts eval meta fur-task
          bun src/cli.ts eval meta fur-do

      - name: Run tests
        run: bun test
